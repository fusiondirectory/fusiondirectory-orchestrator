stages:
  - lint
  - codestyle
  - tarballs
  - trigger

## Stage lint

# PHP lint
create_php_lint_rapport:
  image: registry.fusiondirectory.org/fusiondirectory/fd/phpcodesniffer-cli:fd-php8
  stage: lint
  only:
    - branches
  script:
    - find . -type f -name '*.php' -o -name '*.inc' -print0 | xargs -0 -n1 php -l

## Stage codestyle

# PHP codesniffer
create_php_code_sniffer_rapport:
  image: registry.fusiondirectory.org/fusiondirectory/fd/phpcodesniffer-cli:fd-php8
  stage: codestyle
  only:
    - branches
  script:
    - export PHP_COMPATIBILITY=8.4
    - test -d ../dev-tools/ && rm -Rf ../dev-tools/
    - git clone --depth 1 https://gitlab-ci-token:$GITLAB_CI_TOKEN@gitlab.fusiondirectory.org/fusiondirectory/dev-tools.git ../dev-tools
    - find . -type f -name '*.php' -o -name '*.inc' > ./filelist
    - /root/.composer/vendor/bin/phpcs --standard=../dev-tools/php-codesniffer-rules/FDStandard/ruleset.xml --file-list=./filelist
    - /root/.composer/vendor/bin/phpcs --config-set installed_paths /PHPCompatibility,/PHPCSUtils
    - /root/.composer/vendor/bin/phpcs --standard=PHPCompatibility --runtime-set testVersion $PHP_COMPATIBILITY --file-list=./filelist

# phpstan
create_phpstan_rapport:
  image: registry.fusiondirectory.org/fusiondirectory/fd/phpstan-cli:fd-php8
  stage: codestyle
  only:
    - branches
  script:
    - test -d ../dev-tools/ && rm -Rf ../dev-tools/
    - git clone --depth 1 https://gitlab-ci-token:$GITLAB_CI_TOKEN@gitlab.fusiondirectory.org/fusiondirectory/dev-tools.git ../dev-tools
    - mkdir /usr/share/php/FusionDirectory/
    - git clone --depth 1 https://gitlab-ci-token:$GITLAB_CI_TOKEN@gitlab.fusiondirectory.org/fusiondirectory/fusiondirectory-integrator.git -b php8
    - mv ./fusiondirectory-integrator/src/* /usr/share/php/FusionDirectory/
    - composer global require phpstan/phpstan
    - cp ../dev-tools/phpstan/fusiondirectory-orchestrator/*.neon .
    - /root/.composer/vendor/bin/phpstan analyse -c phpstan.neon

build-tarballs:
  stage: tarballs
  only:
    - php8
  script:
    - mkdir ../fusiondirectory-orchestrator-$VERSION/
    - mv ./* ../fusiondirectory-orchestrator-$VERSION/
    - mv  ../fusiondirectory-orchestrator-$VERSION/ ./
    - tar -cvzf fusiondirectory-orchestrator-$VERSION.tar.gz *
  artifacts:
    paths:
      - fusiondirectory-orchestrator-$VERSION.tar.gz
    expire_in: 30d

build-release:
  stage: tarballs
  only:
    - tags
  script:
    - VERSION=$(grep '%' Changelog.md | head -n1 | cut -d ' ' -f3 | tr -d '"')
    - mkdir ../fusiondirectory-orchestrator-$VERSION/
    - mv ./* ../fusiondirectory-orchestrator-$VERSION/
    - mv  ../fusiondirectory-orchestrator-$VERSION/ ./
    - tar -cvzf fusiondirectory-orchestrator-$VERSION.tar.gz *
  artifacts:
    paths:
      - ./*.tar.gz

trigger-ci-debian-bullseye:
  stage: trigger
  only:
    - php8
  trigger:
    project: debian/bullseye-fusiondirectory-orchestrator-dev
    branch: "php8"


